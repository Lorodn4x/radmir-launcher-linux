[package]
name = "radmir-standalone"
version = "0.1.1"
description = "Clean-room standalone RADMIR launcher for Linux"
license = "Apache-2.0"
authors = ["Lorodn4x <130518306+Lorodn4x@users.noreply.github.com>"]
repository = "https://github.com/Lorodn4x/radmir-launcher-linux"
homepage = "https://github.com/Lorodn4x/radmir-launcher-linux"
edition = "2021"
rust-version = "1.82"

[lib]
name = "radmir_standalone_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = { version = "0.37", features = ["serialize"] }
md5 = { package = "md-5", version = "0.10" }
sha2 = "0.10"
hex = "0.4"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
